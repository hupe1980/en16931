[package]
name        = "en16931"
description = """\
The EN 16931 semantic data model and its business rules, as Rust types. \
Validates the model rather than a serialised document, so findings point at \
BT-151 on line 3 instead of at an XPath. No XML, no PDF, no I/O.\
"""
keywords   = ["einvoice", "en16931", "invoice", "xrechnung", "peppol"]
categories = ["finance", "data-structures", "encoding"]
readme     = "README.md"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
## Stronger payment-identifier checks, via the `sepa` crate.
##
## Without it, BT-84's IBAN check is ISO 7064 mod-97-10 — correct, and blind to
## length, so a 21-character German IBAN passes. With it, the full ISO 13616
## registry, plus an EPC creditor-identifier check on BT-90.
##
## Off by default: it brings `quick-xml`, which this crate otherwise goes to
## some lengths not to have.
sepa = ["dep:sepa"]
## Emit a `ValidationReport` as SVRL, which every Schematron tool here speaks.
##
## **Adds no dependencies.** SVRL is a report format, not an invoice syntax:
## writing it needs escaping, not a parser, and no UBL or CII element names.
svrl = []
default = []
## `serde::Serialize` / `Deserialize` on all public types.
##
## Types carrying invariants re-run their validation on deserialisation via
## `#[serde(try_from = ...)]` rather than trusting reconstructed fields.
serde = ["dep:serde", "rust_decimal/serde"]
## Convert to and from `chrono::NaiveDate`.
chrono = ["dep:chrono"]
## Convert to and from `time::Date`.
time = ["dep:time"]
## Conversion from `billing::BillingDocument`.
billing = ["dep:billing"]

[dependencies]
# The same two dependencies `billing` has, for the same reason: an invoice model
# has no business pulling in a runtime. Everything else is optional.
rust_decimal.workspace = true
thiserror.workspace    = true

billing = { version = "0.13", optional = true }
serde   = { workspace = true, optional = true }
chrono  = { version = "0.4", optional = true, default-features = false }
time    = { version = "0.3", optional = true, default-features = false }
sepa    = { version = "0.5", default-features = false, optional = true }

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }
proptest  = "1.11.0"
# Test-only, for `tests/conformance.rs`: reads CEN's and KoSIT's UBL
# conformance instances so the rules can be checked against the authorities'
# own suites. The library ships no XML and has no XML dependency.
roxmltree    = { workspace = true }
rust_decimal = { workspace = true, features = ["macros"] }
serde_json   = "1"

# Both report shapes are feature-gated, so the example is too — rather than
# compiling to a program that only prints "build with --features …".
[[example]]
name              = "report_formats"
required-features = ["serde", "svrl"]

[[bench]]
name    = "validate"
harness = false
