<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     role="img" aria-label="en16931 — the European e-invoice in Rust">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a35"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#003399"/>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="150" fill="#7aa2ff" font-size="26" letter-spacing="4"
          font-weight="600">EN 16931 · XRECHNUNG · PEPPOL · ZUGFERD</text>
    <text x="80" y="268" fill="#ffffff" font-size="96" font-weight="800"
          letter-spacing="-3">en16931</text>
    <text x="80" y="340" fill="#e7eaf0" font-size="42" font-weight="600">
      The European e-invoice, as Rust types.
    </text>
    <text x="80" y="404" fill="#9aa4b2" font-size="28">
      317 business rules. UBL 2.1 and UN/CEFACT CII, both directions.
    </text>
    <text x="80" y="446" fill="#9aa4b2" font-size="28">
      Findings point at BT-151, never at an XPath.
    </text>

    <g font-size="24" fill="#7aa2ff" font-weight="600">
      <text x="80"  y="552">0 disagreements with CEN's suite</text>
      <text x="520" y="552">490 documents round-tripped</text>
      <text x="920" y="552">2 µs per invoice</text>
    </g>
  </g>
  <rect x="80" y="500" width="1040" height="1" fill="#262c36"/>
</svg>
