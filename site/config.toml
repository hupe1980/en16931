# Zola configuration. Built by `.github/workflows/site.yml` and served from
# GitHub Pages; every generated URL (canonical links, sitemap, feed, Open Graph)
# derives from `base_url`.
base_url = "https://hupe1980.github.io/en16931"
title = "en16931"
description = "The EN 16931 European e-invoice as Rust types: 334 business rules, UBL 2.1 and UN/CEFACT CII in both directions, XRechnung, Peppol BIS Billing 3.0 and ZUGFeRD / Factur-X."
default_language = "en"
author = "hupe1980"

compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]

[markdown]
smart_punctuation = true
render_emoji = false

[markdown.highlighting]
error_on_missing_language = true
# Class-based, with a light and a dark theme, so the page follows the reader's
# system setting.
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"


[search]
include_title = true
include_description = true
include_path = true
include_content = true

[extra]
# Values the templates use beyond Zola's own.
repo = "https://github.com/hupe1980/en16931"
docs_rs = "https://docs.rs/en16931"
crates_io = "https://crates.io/crates/en16931"
edition = "EN 16931-1:2017+A1:2019"
artefacts = "validation-1.3.17"
