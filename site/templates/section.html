{% extends "base.html" %}
{% block content %}
<div class="wrap doc">
  <article>
    <h1>{{ section.title }}</h1>
    <p class="lede">{{ section.description }}</p>
    {{ section.content | safe }}
    <div class="cards">
      {% for p in section.pages %}
      <a class="card" href="{{ p.permalink | safe }}">
        <h3>{{ p.title }}</h3>
        <p>{{ p.description }}</p>
      </a>
      {% endfor %}
    </div>
  </article>
</div>
{% endblock content %}
