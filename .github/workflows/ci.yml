name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reusable — called by release.yml

# Cancel any in-progress run for the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  # ── Formatting ──────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ── Linting ─────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ── Documentation ───────────────────────────────────────────────────────────
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `-D warnings`, matching `just doc`. Without it a broken intra-doc link
      # is a warning nobody reads, and rustdoc's link checking is the only
      # thing that notices a `[`crate::foo`]` pointing at something that has
      # moved or been deleted.
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features

  # ── Feature powerset ────────────────────────────────────────────────────────
  # Features gate what compiles at all here, so "it builds with everything on"
  # proves very little. Each combination below changes the dependency graph.
  #
  # Scoped with `-p`, deliberately. The features belong to individual crates,
  # and a workspace-wide `--features svrl` does not even parse. More importantly
  # the *claims* are per crate: "en16931 builds for wasm32" is the promise its
  # README makes, and a `--workspace` build would fail on `lopdf` for a reason
  # that says nothing about the model crate.
  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # en16931 — the model.
      - name: en16931 · no default features
        run: cargo clippy -p en16931 --all-targets --no-default-features -- -D warnings
      - name: en16931 · svrl only
        run: cargo clippy -p en16931 --all-targets --no-default-features --features svrl -- -D warnings
      - name: en16931 · serde only
        run: cargo clippy -p en16931 --all-targets --no-default-features --features serde -- -D warnings
      # The calculation-engine seam. Its own combination, because `billing` is
      # the only optional dependency that brings a whole domain model with it —
      # and the adapter tracks its API, so a `cargo update` that moves `billing`
      # must fail here rather than in `--all-features`, where the message would
      # be buried under everything else.
      - name: en16931 · billing adapter
        run: cargo clippy -p en16931 --all-targets --no-default-features --features billing -- -D warnings

      # en16931-formats — the syntax bindings.
      - name: en16931-formats · ubl only (default)
        run: cargo clippy -p en16931-formats --all-targets -- -D warnings
      - name: en16931-formats · cii only
        run: cargo clippy -p en16931-formats --all-targets --no-default-features --features cii -- -D warnings
      - name: en16931-formats · no syntax at all
        run: cargo clippy -p en16931-formats --all-targets --no-default-features -- -D warnings
      - name: en16931-formats · zugferd (pulls in a PDF parser)
        run: cargo clippy -p en16931-formats --all-targets --features zugferd -- -D warnings

      # en16931-cli — the command. It has no features of its own on purpose: a
      # binary is in nobody's dependency graph, so it turns everything on and
      # there is no combination to sweep. What is worth checking is that it
      # still builds against the libraries' widest surface.
      - name: en16931-cli
        run: cargo clippy -p en16931-cli --all-targets -- -D warnings

      # The whole point of `en16931` is that it has no I/O and no XML. If it
      # stops building for wasm32, something was added that should not have been.
      - name: wasm32 · en16931
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p en16931 --target wasm32-unknown-unknown --no-default-features --features svrl,serde
      # The syntax bindings reach wasm too, as long as `zugferd` is off —
      # `lopdf` brings getrandom and libc, so it is excluded rather than
      # expected to pass.
      - name: wasm32 · en16931-formats (ubl + cii)
        run: cargo build -p en16931-formats --target wasm32-unknown-unknown --features cii

  # ── Generated code and the authorities' suites ──────────────────────────────
  # Five generated files across both crates — the code lists, and the element
  # order and prohibition tables for each syntax — are derived from the
  # artefacts, not written by hand. The conformance and corpus suites run CEN's
  # and KoSIT's own instances. All of it needs `spec/`, which is not committed,
  # so without this job the tables could drift and the suites would skip while
  # still reporting green.
  #
  # One fetch serves both crates, which is the concrete payoff of one
  # repository: this job used to exist twice and download the same 136 MB twice.
  codegen:
    name: Generated code and conformance suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the CEN / KoSIT / Peppol artefacts
        run: cargo xtask fetch
      - name: Generated code is current
        run: cargo xtask check
      # `EN16931_REQUIRE_SPEC=1` turns "skip because spec/ is missing" into a
      # failure. Without it this job's guarantee is aspirational: the suites
      # skip silently, report green, and the run says the conformance corpus
      # passed when it validated nothing. That is not hypothetical — moving the
      # crates under `crates/` did exactly that, and every suite stayed green.
      - name: Suites that need the artefacts
        run: cargo test --workspace --all-features
        env:
          EN16931_REQUIRE_SPEC: "1"

  # ── Benchmarks ──────────────────────────────────────────────────────────────
  # Compile-only: timings on shared runners are too noisy to gate on, but a
  # benchmark that no longer builds is a real break.
  bench:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p en16931 --no-run --all-features

  # ── MSRV ────────────────────────────────────────────────────────────────────
  # The toolchain comes from the manifests, so the job and they cannot disagree
  # — or agree while both are wrong, which is what happened once.
  #
  # The root is a *virtual* manifest with no `[package]`, so this takes the
  # highest `rust-version` across the published members rather than looking for
  # a package at the root. Both inherit `[workspace.package]` today; taking the
  # maximum means a member that later raises its own does not silently get
  # tested against a lower one.
  msrv:
    name: MSRV (from the manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Read the highest rust-version in the workspace
        id: msrv
        run: |
          V=$(cargo metadata --no-deps --format-version 1 | python3 -c "
          import sys, json
          m = json.load(sys.stdin)
          members = set(m['workspace_members'])
          vs = [p['rust_version'] for p in m['packages']
                if p['id'] in members and p.get('rust_version')]
          if not vs:
              sys.exit('no member declares rust-version')
          print(max(vs, key=lambda v: [int(x) for x in v.split('.')]))
          ")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "MSRV is $V"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # Build, not test: dev-dependencies may need a newer compiler than the
      # crates, and holding them to the MSRV would pin it to theirs.
      - run: cargo build --workspace --all-features
      - run: cargo build --workspace --no-default-features

  # ── Test matrix ─────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }} · Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy]       # fail fast before the expensive matrix
    strategy:
      fail-fast: false
      matrix:
        os:   [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        exclude:
          # beta only on ubuntu, to keep the matrix manageable
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: beta
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}
      - name: Test — default features
        run: cargo test --workspace --all-targets
      - name: Test — all features
        run: cargo test --workspace --lib --tests --all-features
      - name: Test — no default features
        run: cargo test --workspace --all-targets --no-default-features
      - name: Doc tests
        run: cargo test --workspace --doc --all-features

  # ── Security advisory scan ──────────────────────────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit

  # ── License / dependency policy ─────────────────────────────────────────────
  deny:
    name: cargo-deny (licenses + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo-deny
        run: cargo deny --all-features check

  # ── Semver ──────────────────────────────────────────────────────────────────
  # Needs a published baseline to diff against, so it is a no-op until a crate's
  # first release — and switches itself on when that happens, rather than
  # waiting for someone to remember. It is a linter, not a prover: behavioural
  # breakage is invisible to it and is covered by the suites instead.
  #
  # One job per crate: they version independently, and `en16931-formats` being
  # unpublished must not suppress the check on `en16931`.
  semver:
    name: Semver compatibility (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [en16931, en16931-cli, en16931-formats]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Is ${{ matrix.crate }} on crates.io yet?
        id: published
        run: |
          if curl -sfL "https://crates.io/api/v1/crates/${{ matrix.crate }}" -o /dev/null; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.crate }} is not published yet — no baseline to compare against"
          fi
      # `en16931-cli` exposes no library API, so semver-checks has nothing to
      # compare — it is listed anyway so that adding one later is covered
      # without anybody remembering to extend the matrix.
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        if: steps.published.outputs.yes == 'true'
        with:
          package: ${{ matrix.crate }}
