name: Site

# The documentation site in `site/`, built with Zola and served from GitHub
# Pages. Separate from `ci.yml` on purpose: a prose change should not run the
# conformance suites, and a code change should not redeploy the site.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# Pages needs these; nothing else in this repository does.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half-way — a cancelled deploy
# can leave Pages serving a partial build.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.22.1"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin zola

      # A missing page shows up here and not locally: the checkout has only the
      # tracked files, so a page that is gitignored on a contributor's machine
      # is simply absent, and any `@/…` link to it is broken. That has happened.
      # `just tracked` is the local half of the same check — this is the half
      # that cannot be skipped.
      #
      # `--drafts` is deliberately absent: a draft that reaches production is a
      # page nobody proof-read. On a pull request the base URL is unknown, so
      # the build only has to succeed — it is not deployed.
      - name: Build
        run: zola --root site build

      # Internal links only. `zola check` also resolves every external URL,
      # which turns an unrelated site's outage into a red build here.
      - name: Check internal links
        run: zola --root site check --skip-external-links

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site/public

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
