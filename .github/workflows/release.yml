name: Release

# Trigger: push a semver tag, e.g. `git tag v0.2.0 && git push --tags`
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        # v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+-*"      # v1.2.3-rc.1, v1.2.3-alpha

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Re-run the full CI suite against the tagged commit ──────────────────────
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # ── Verify the tag matches Cargo.toml ───────────────────────────────────────
  verify-version:
    name: Verify crate version
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag matches Cargo.toml
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json,os;m=json.load(sys.stdin);r=os.path.realpath('Cargo.toml');print(next(p['version'] for p in m['packages'] if os.path.realpath(p['manifest_path'])==r))")
          if [ "$TAG" != "$CRATE_VERSION" ]; then
            echo "::error::Tag v${TAG} does not match Cargo.toml version ${CRATE_VERSION}"
            exit 1
          fi
          echo "✓ Tag v${TAG} matches Cargo.toml version ${CRATE_VERSION}"

  # ── Publish to crates.io ────────────────────────────────────────────────────
  publish:
    name: Publish to crates.io
    needs: [ci, verify-version]
    runs-on: ubuntu-latest
    environment: crates-io        # require manual approval in GitHub
    permissions:
      contents: write             # needed to create a GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # The workspace contains `xtask`, so `cargo publish` with no `-p` is
      # ambiguous — and `packages[0]` is `xtask`, which is a real crate on
      # crates.io. Name the root package explicitly, derived rather than typed.
      - name: Identify the crate
        id: crate
        run: |
          NAME=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json,os;m=json.load(sys.stdin);r=os.path.realpath('Cargo.toml');print(next(p['name'] for p in m['packages'] if os.path.realpath(p['manifest_path'])==r))")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Dry-run publish (verify everything packs correctly)
        run: cargo publish -p ${{ steps.crate.outputs.name }} --dry-run

      - name: Publish
        run: cargo publish -p ${{ steps.crate.outputs.name }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: "${{ steps.crate.outputs.name }} ${{ github.ref_name }}"
