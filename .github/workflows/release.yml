name: Release

# Trigger: push a semver tag — `git tag v0.2.0 && git push --tags`
#
# One tag releases both crates, because they share one version
# (`[workspace.package] version`) and are published in dependency order.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        # v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+-*"      # v1.2.3-rc.1, v1.2.3-alpha

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Re-run the full CI suite against the tagged commit ──────────────────────
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # ── Verify the tag matches the workspace version ────────────────────────────
  verify-version:
    name: Verify version
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag, both manifests and the workspace agree
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          # Read every published member: inheritance means they must be equal,
          # and comparing them all catches a member that opted out of it.
          cargo metadata --no-deps --format-version 1 | python3 -c "
          import sys, json
          m = json.load(sys.stdin)
          members = set(m['workspace_members'])
          vs = {p['name']: p['version'] for p in m['packages']
                if p['id'] in members and p.get('publish') != []}
          if len(set(vs.values())) != 1:
              sys.exit(f'members disagree on the version: {vs}')
          v = next(iter(vs.values()))
          if v != '$TAG':
              sys.exit(f'tag v$TAG does not match the workspace version {v}')
          print(f'✓ v$TAG — {\", \".join(sorted(vs))}')
          "

  # ── Publish to crates.io ────────────────────────────────────────────────────
  publish:
    name: Publish to crates.io
    needs: [ci, verify-version]
    runs-on: ubuntu-latest
    environment: crates-io        # require manual approval in GitHub
    permissions:
      contents: write             # needed to create a GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # `--workspace` resolves the publish order from the dependency graph and
      # waits for the index between crates. Doing it by hand needs both, and
      # gets the dry-run wrong: `cargo publish -p en16931-formats --dry-run`
      # cannot succeed before `en16931` is on the index at the new version,
      # because that is exactly what its requirement asks for.
      #
      # `xtask` is `publish = false`, so it is skipped without an --exclude.
      - name: Dry run
        run: cargo publish --workspace --dry-run

      - name: Publish
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: ${{ github.ref_name }}
