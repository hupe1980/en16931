# cargo-deny configuration
# Docs: https://embarkstudios.github.io/cargo-deny/

# ── Graph configuration ──────────────────────────────────────────────────────
[graph]
targets      = []     # check all targets
all-features = false  # CI runs `--all-features` separately

# ── Security advisories ──────────────────────────────────────────────────────
[advisories]
version = 2
ignore  = []

# ── License policy ───────────────────────────────────────────────────────────
#
# Note what is *not* here: EUPL-1.2. The CEN validation artefacts carry it, and
# it is reciprocal — which is exactly why `spec/` is fetched rather than
# committed, and why the generated tables contain facts about element placement
# rather than copied expressions. Nothing EUPL-licensed is in the dependency
# graph, and this list is what keeps that true.
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
]
confidence-threshold = 0.8

# ── Dependency bans ──────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"   # different semver-majors are common and harmless
wildcards         = "deny"   # a wildcard version is not a pinned dependency
highlight         = "all"
deny              = []

# ── Sources ──────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
