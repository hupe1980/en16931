# cargo-deny configuration, for the whole workspace
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets      = []     # every target, so a platform-specific dependency cannot hide
all-features = true   # the widest graph this workspace can produce

[advisories]
version = 2
ignore  = []

# ── Licence policy ───────────────────────────────────────────────────────────
#
# Note what is *not* here: EUPL-1.2. The CEN validation artefacts carry it, which
# is why `spec/` is fetched rather than committed and why the generated tables
# hold facts about element placement rather than copied expressions. This list
# is what keeps that true.
#
# The entries are measured, not guessed: `cargo deny list` shows exactly what the
# graph resolves to, and `unused-allowed-license = "deny"` makes an entry that
# stops being needed an error rather than a warning nobody reads.
[licenses]
version                 = 2
unused-allowed-license  = "deny"
confidence-threshold    = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",   # unicode-ident
    # `encoding_rs` is `(Apache-2.0 OR MIT) AND BSD-3-Clause` — the AND makes
    # this one mandatory rather than an alternative. It arrives through `lopdf`,
    # so it is in the graph only when `en16931-formats/zugferd` is on. `en16931`
    # itself never sees it, which is the point of that feature being off by
    # default.
    "BSD-3-Clause",
]

[bans]
multiple-versions = "warn"   # different semver-majors are common and harmless
wildcards         = "deny"   # a wildcard version is not a pinned dependency
highlight         = "all"
deny              = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
