[workspace]
resolver = "3"
members  = [
    "crates/en16931",
    "crates/en16931-cli",
    "crates/en16931-formats",
    "xtask",
]

# `en16931-formats` depends on `en16931`; rustc forbids the reverse, which is
# what enforces "the semantic rules do not depend on a syntax". `en16931-cli` is
# the only binary, and depends on both with every feature on — sound because
# nothing depends on it. `xtask` runs `fetch` / `codegen` and is not published.
#
# One repository because both libraries derive their tables from the same four
# upstream artefacts at the same revision, and
# `every_artefact_pin_in_the_workspace_agrees` compares all three copies of that
# pin — which nothing could do across a repository boundary.

[workspace.package]
# All three release in lockstep. Bump here and in the two requirements below —
# the only other copies of the number, and cargo rejects a bump that misses one.
version      = "0.6.0"
edition      = "2024"
# `let`-chains, stabilised in 1.88. CI reads this rather than repeating it.
rust-version = "1.88"
authors      = ["hupe1980"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/hupe1980/en16931"

[workspace.dependencies]
# `version` as well as `path`, so `cargo publish` resolves them from crates.io.
en16931         = { version = "0.6.0", path = "crates/en16931" }
en16931-formats = { version = "0.6.0", path = "crates/en16931-formats" }

# Pinned once: two `rust_decimal` majors in one graph means two incompatible
# `Decimal` types.
rust_decimal = { version = "1.42", default-features = false, features = ["std"] }
roxmltree    = "0.21"
thiserror    = "2"
serde        = { version = "1", features = ["derive"] }
