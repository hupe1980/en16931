[workspace]
resolver = "3"
members  = [
    "crates/en16931",
    "crates/en16931-cli",
    "crates/en16931-formats",
    "xtask",
]
# `fuzz/` is cargo-fuzz's own workspace (nightly); `just fuzz` and CI build it.
exclude = ["fuzz"]

# `en16931-formats` depends on `en16931`, never the reverse: the semantic rules
# cannot depend on a syntax. `en16931-cli` depends on both with every feature on.
# `xtask` (fetch, codegen) is not published.

[workspace.package]
# All three crates release in lockstep: bump here and in the two requirements below.
version      = "0.10.0"
edition      = "2024"
# `let`-chains need 1.88. CI reads this value.
rust-version = "1.88"
authors      = ["hupe1980"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/hupe1980/en16931"

[workspace.dependencies]
# `version` as well as `path`, so `cargo publish` resolves them from crates.io.
en16931         = { version = "0.10.0", path = "crates/en16931" }
en16931-formats = { version = "0.10.0", path = "crates/en16931-formats" }

# Pinned once: two `rust_decimal` versions would mean two incompatible `Decimal` types.
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
roxmltree    = "0.21"
thiserror    = "2"
serde        = { version = "1", features = ["derive"] }

# Used by `cargo mutants` (`.cargo/mutants.toml`): every mutant is a fresh build,
# so debuginfo and incremental state only cost time.
[profile.mutants]
inherits    = "dev"
debug       = false
incremental = false
