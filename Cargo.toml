[workspace]
resolver = "3"
members  = [
    "crates/en16931",
    "crates/en16931-cli",
    "crates/en16931-formats",
    "xtask",
]

# ── Why one repository and two crates ─────────────────────────────────────────
#
# The *crate* boundary is load-bearing and stays exactly as it was:
# `en16931-formats` depends on `en16931`, so rustc forbids the reverse, and
# "the semantic rules do not depend on a syntax" is enforced rather than asked
# for. A workspace does not weaken that — acyclicity is a per-crate rule, not a
# per-repository one.
#
# The *repository* boundary bought nothing and cost real work. Both crates
# derive their tables from the same four upstream artefact repositories at the
# same pinned revision; split, that meant two `xtask/src/fetch.rs`, two `spec/`
# trees of the same 136 MB, and two `CEN_REF` constants that had to be kept in
# step by hand — with `en16931-formats` carrying a comment asserting its pin
# "must equal `en16931::ARTEFACT_VERSION`" and no way to check it across the
# gap. `every_artefact_pin_in_the_workspace_agrees`, in
# `crates/en16931/tests/artefact_pin.rs`, now does — under that name, which is
# not the one this comment invented for it and then cited for two releases.
#
# It also made every coordinated breaking change a `[patch.crates-io]` block
# with a "delete this later" comment, plus a publish-ordering hazard. Here it is
# a path dependency that is always right, and `cargo publish` derives the order
# from the graph.
#
# `en16931-cli` is the third published member and the only binary. It depends on
# both libraries with every feature on, which is sound precisely because nothing
# depends on *it*: the graph-size discipline that shapes the libraries' feature
# flags exists to protect a consumer's dependency tree, and a binary is in
# nobody's.
#
# `xtask` is the build-task runner (`cargo xtask fetch` / `codegen`). Not
# published, and its dependencies never reach a consumer.

[workspace.package]
# Lockstep: `en16931-formats` re-exports `en16931`'s types across its surface,
# so a breaking change to the model breaks the bindings either way. Cost is
# republishing an unchanged crate on a bindings-only patch.
#
# Bump here and in the dependency requirement below — the only two places.
version      = "0.5.0"
edition      = "2024"
# `let`-chains, stabilised in 1.88. CI reads this value rather than repeating it.
rust-version = "1.88"
authors      = ["hupe1980"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/hupe1980/en16931"

[workspace.dependencies]
# The internal edges. A `version` as well as a `path`, so `cargo publish`
# resolves them from crates.io. Cargo has no `version.workspace` for a
# dependency requirement, so these are the only other copies of the number, and
# the resolver itself catches a bump that misses one:
#
#   error: failed to select a version for the requirement `en16931 = "^0.4.0"`
#
# `every_member_inherits_its_version` asserts the other half — that no member
# has quietly gone back to declaring a version of its own, which resolves fine
# and silently opts out of the workspace bump.
en16931         = { version = "0.5.0", path = "crates/en16931" }
en16931-formats = { version = "0.5.0", path = "crates/en16931-formats" }

# Pinned once, for the reason `en16931-formats` states at its own use site: two
# `rust_decimal` majors in one graph means two incompatible `Decimal` types and
# a compile error nobody enjoys diagnosing.
rust_decimal = { version = "1.42", default-features = false, features = ["std"] }
roxmltree    = "0.21"
thiserror    = "2"
serde        = { version = "1", features = ["derive"] }
